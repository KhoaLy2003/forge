[project]
name = "forge"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jsonschema>=4",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
forge = "cli:main"

[tool.setuptools]
py-modules = ["cli"]
packages = ["core", "core.ui", "templates"]
include-package-data = true

[tool.setuptools.package-data]
templates = ["**/*", "**/.*"]
"core.ui" = ["static/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
