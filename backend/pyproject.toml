[project]
name = "forge"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
forge = "cli:main"

[tool.setuptools]
py-modules = ["cli"]
packages = ["core", "templates"]
include-package-data = true

[tool.setuptools.package-data]
templates = ["**/*", "**/.*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
