# Local monitoring stack: Prometheus (metrics), Grafana (dashboards), Loki + Alloy (logs).
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Grafana:    http://localhost:3000   (admin / $GRAFANA_ADMIN_PASSWORD, default "admin" - LOCAL USE ONLY)
# Prometheus: http://localhost:9090
#
# Every port is bound to 127.0.0.1 so nothing is reachable from the network. Retention here is a
# local default (Prometheus 15 days, Loki 7 days); production retention is a decision for the
# owning team - see docs/observability/runbook.md.
#
# Alloy mounts the Docker socket read-only to read container stdout. That is acceptable on a
# developer machine but must not be copied to production without a security review.
services:
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    ports:
      - "127.0.0.1:3000:3000"

  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  alloy:
    image: grafana/alloy:v1.5.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
