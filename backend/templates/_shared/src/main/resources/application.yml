spring:
  application:
    name: {{ artifact_id }}
  profiles:
    active: dev
{% if use_liquibase %}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
{% endif %}
  jpa:
    hibernate:
      ddl-auto: {% if use_liquibase %}none{% else %}update{% endif %}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
