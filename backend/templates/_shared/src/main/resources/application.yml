spring:
  application:
    name: {{ artifact_id }}
  profiles:
    active: dev
{% if use_liquibase %}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
{% endif %}
  jpa:
    hibernate:
      ddl-auto: {% if use_liquibase %}none{% else %}update{% endif %}

management:
{% if include_monitoring %}
  server:
    # Metrics are served on their own port so /actuator/prometheus is never reachable through the
    # public API port. Publish this port only to the monitoring network (see docs/observability).
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    # Only low-cardinality tags: never request ids, user ids or raw URLs.
    tags:
      application: ${spring.application.name}
      environment: ${DEPLOYMENT_ENVIRONMENT:development}
    distribution:
      percentiles-histogram:
        http.server.requests: true
{% endif %}
  endpoints:
    web:
      exposure:
        include: {% if include_monitoring %}health,info,prometheus{% else %}health,info{% endif %}

server:
  port: 8080

app:
  logging:
    # RequestLogFilter logs requests at or above this duration at WARN.
    slow-request-ms: 2000
{% if use_liquibase %}
  notifications:
    # How often the delivery worker runs, how many deliveries it claims per pass, and how long a
    # claim is held before another instance may take it over.
    worker-enabled: true
    worker-delay-ms: 3000
    batch-size: 100
    lease-seconds: 300
    max-attempts: 5
    default-locale: en
  mail:
    # Blank host = email not configured: email deliveries are skipped, not failed.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    starttls: ${MAIL_STARTTLS:true}
{% endif %}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{request_id}] %-5level %logger{36} - %msg%n"
