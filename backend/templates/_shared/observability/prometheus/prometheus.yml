# Scrapes the application's metrics endpoint. The app serves /actuator/prometheus on the management
# port (8081 by default), never on the public API port. When the app runs on the host (mvn
# spring-boot:run) Prometheus reaches it through host.docker.internal; when it runs as a container
# on the same compose network, change the target to <service-name>:8081.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: {{ artifact_id }}
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          service: {{ artifact_id }}
