[project]
name = "forge-web"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
forge-web = "forge_web.cli:main"

[tool.setuptools]
packages = ["forge_web", "forge_web.core", "forge_web.templates"]
include-package-data = true

[tool.setuptools.package-data]
"forge_web.templates" = ["**/*", "**/.*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
