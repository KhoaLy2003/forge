name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:coverage

      # test:coverage above already fails the build below 80% line coverage
      # (vite.config.ts's test.coverage.thresholds); this step only makes
      # the number visible on the run summary page.
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo "### Code coverage (gate: 80% lines)"
              node -e "const s=require('./coverage/coverage-summary.json').total.lines; console.log('**Overall line coverage: ' + s.pct + '%** (' + s.covered + '/' + s.total + ' lines)')"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Code coverage: report not generated (tests failed before coverage was written)" >> "$GITHUB_STEP_SUMMARY"
          fi

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        with:
          category: "/language:javascript-typescript"

  trivy-fs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      # Generates package-lock.json so Trivy can resolve exact installed
      # versions instead of just package.json's semver ranges, for much more
      # precise CVE matching. This scaffold doesn't ship a committed lockfile.
      - name: Install dependencies
        run: npm install

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-report.txt
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Write summary
        if: always()
        run: |
          {
            echo "### Trivy filesystem scan"
            echo '```'
            cat trivy-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install zizmor
        run: pip install zizmor

      - name: Run zizmor
        run: |
          {
            echo "### Zizmor findings"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          zizmor --format plain --color never .github/workflows/ | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        shell: bash
