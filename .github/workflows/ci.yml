name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR so only the latest run keeps going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      # backend/tests/test_generation.py and test_validator.py shell out to a real
      # `mvn test-compile` (via core/validator.py's run_compile) against a rendered
      # Spring Boot 4 project, so the runner needs a JDK. Maven itself ships
      # preinstalled on ubuntu-latest GitHub-hosted runners.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: "temurin"
          java-version: "21"

      # Fail fast and clearly if Maven is ever missing, instead of surfacing as a
      # confusing pytest failure further down.
      - name: Verify Maven is available
        run: mvn -version

      - name: Install project
        run: pip install -e "./backend[dev]"

      - name: Run tests
        run: pytest backend/tests -v

      - name: Forge summary
        if: success()
        run: .github/workflows/forge-summary.sh backend

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: frontend/pyproject.toml

      # frontend/tests/test_generation.py shells out to a real `npm install`,
      # `npm run build`, and `npx tsc --noEmit` against a rendered Vite project, so
      # the runner needs Node/npm on PATH. No separate npm install step is needed
      # here - the test itself drives npm against the generated project.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install project
        run: pip install -e "./frontend[dev]"

      - name: Run tests
        run: pytest frontend/tests -v

      - name: Forge summary
        if: success()
        run: .github/workflows/forge-summary.sh frontend

  codeql-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        with:
          languages: python
          build-mode: none

      - uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        with:
          category: "/language:python"

  codeql-javascript:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # No plain JS/TS source lives here — this scans the Jinja-templated
      # React/TS scaffold under frontend/forge_web/templates/base. Files with
      # {{ }} placeholders in JSX/TS aren't valid syntax; CodeQL skips what it
      # can't parse rather than failing the job, so this is safe but expect
      # sparse findings until real (non-templated) JS/TS exists in the repo.
      - uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        with:
          category: "/language:javascript-typescript"

  trivy-fs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-report.txt
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Write summary
        if: always()
        run: |
          {
            echo "### Trivy filesystem scan"
            echo '```'
            cat trivy-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install zizmor
        run: pip install zizmor

      - name: Run zizmor
        run: |
          {
            echo "### Zizmor findings"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          zizmor --format plain --color never .github/workflows/ | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        shell: bash

  changelog-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Run scripts/ tests
        run: python -m pytest scripts/ -v

      - name: Check backend CHANGELOG.md matches pyproject.toml
        run: python scripts/check_changelog_version.py --package backend

      - name: Check frontend CHANGELOG.md matches pyproject.toml
        run: python scripts/check_changelog_version.py --package frontend
